type: object
x-stoplight:
  id: e9c87m9dcgyx7
description: 'A certification record, created when a certification request is closed. It includes a reference to the cyber assessment report.'
required:
  - createdAt
  - updatedAt
  - version
properties:
  certifiedBy:
    type: string
    x-stoplight:
      id: t0tog42vhomcq
    format: email
    example: user@example.com
    description: Person who performed the assessment resulting in certification
  certifiedOn:
    type: string
    format: date-time
    x-stoplight:
      id: xrqi77xjcnf6j
    example: '2025-08-11T05:49:57.000Z'
    description: Date the version was certified
  reportUrl:
    type: string
    x-stoplight:
      id: xbwd246lod0r8
    format: uri
    description: URL link to the official certification report whicih includes any identified vulnerabilities
    example: 'https://leap.schneider-electric.com/OneXperiencePortal/APIDetailsReport.aspx?APIID=API0999&IsAPICatalog=True'
  riskProfile:
    $ref: ./Certification Risk Profile.yaml
    x-stoplight:
      id: 2pjqr6fjkgafe
    description: Assessed risk profile
  createdAt:
    $ref: ../models/CreatedAt.yaml
    description: The time this record was created
    x-stoplight:
      id: non3xvssl2yn9
  updatedAt:
    $ref: ../models/UpdatedAt.yaml
    description: The time this record was last updated
    x-stoplight:
      id: 6tiwrcodoco86
  version:
    $ref: ./Version.yaml
    x-stoplight:
      id: tx0mesyy4ztz5
    description: API version assessed
title: Certification
