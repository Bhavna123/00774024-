title: Read Notification
description: |-
  Record capturing whether an API portal user has read or dismissed a specific notification.

  No record will exists for a stakeholder who has yet to open the notification feed since it was posted.
required:
  - wasRead
  - wasDismissed
  - createdAt
  - updatedAt
  - notification
  - stakeholder
properties:
  wasRead:
    type: boolean
    x-stoplight:
      id: rlvtsbwwkj3aa
    description: Whether or not the notification has been read by a stakeholder
  wasDismissed:
    type: boolean
    x-stoplight:
      id: qrju6aaoiorgx
    description: 'Whether or not a notification has been dismissed by a stakholder, meaning they do not want to see it again'
  createdAt:
    $ref: ../models/CreatedAt.yaml
    description: The time this record was created
    x-stoplight:
      id: azzh7o7jxpn5l
  updatedAt:
    $ref: ../models/UpdatedAt.yaml
    description: The time this record was last updated
    x-stoplight:
      id: 22cwe1h4wlwc3
  notification:
    $ref: ./Notification.yaml
    x-stoplight:
      id: lj8clji3cwnux
    description: A notification for the API community
  stakeholder:
    $ref: ./Stakeholder.yaml
    x-stoplight:
      id: qp4y39sy9h65p
    description: Person who has interacted with the notification feed on the API portal
