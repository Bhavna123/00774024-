title: Requirement
description: 'Main entry point for the technical requirements for a given proxy. One instance of this model is one iteration of a proxy''s technical requirements. Each proxy has a list of these, which can be thought of the revision history for this proxy over time.'
required:
  - id
  - isWorkInProgress
  - createdAt
  - updatedAt
  - developerComments
  - environments
  - mediation
  - pathMappings
  - payloadSize
  - providers
  - security
  - supportContacts
  - consumers
  - trafficManagement
