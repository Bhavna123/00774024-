type: object
x-stoplight:
  id: ut4l046xm7hr3
description: 'Person with some involvement in an API lifecycle, identified by their email and optionally a SESA id.'
required:
  - id
  - email
  - createdAt
  - updatedAt
  - ownedApis
  - ownedConsumers
  - requestedExceptions
  - apiOwnerForTickets
  - appOwnerForTickets
  - requesterForTickets
  - ratings
  - readNotifications
properties:
  id:
    $ref: ../models/Id.yaml
    x-stoplight:
      id: vecj96tn3ahmd
    description: Database identifier
  email:
    type: string
    x-stoplight:
      id: ggnsobai4ipcw
    description: Unique email address for this stakeholder
    example: user@example.com
  roles:
    type: array
    x-stoplight:
      id: lxdn8voolfumg
    description: 'Stakeholder roles. If not set, user is the default role.'
    items:
      x-stoplight:
        id: ke8v5198qbr3z
      enum:
        - user
        - admin
        - api_owner
        - app_owner
  sesaId:
    type: string
    x-stoplight:
      id: atn9oho13ajvt
    description: Schneider electric corporate id
    example: SESA12345
  createdAt:
    $ref: ../models/CreatedAt.yaml
    description: The time this record was created
    x-stoplight:
      id: vhl80ery346gx
  updatedAt:
    $ref: ../models/UpdatedAt.yaml
